[project]
name = "nun"
version = "1.0.0"
description = "Nūn: photograph Arabic calligraphy, see the verse as in the Mushaf, listen, and ask in any language"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.34",
    "pillow>=10.4",
    "rapidfuzz>=3.9",
    "anthropic>=1.0",
    "opencv-python-headless>=4.10",
    "pypdf>=5",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# GPU inference: Nūn Vision (Muse Glimmer 30B 4-bit + LoRA) needs transformers 5.15; torch is installed first from the
# CUDA 12.8 index (see README).
ml = [
    "transformers==5.15.0",
    "peft>=0.19",
    "accelerate>=1.10",
    "bitsandbytes>=0.47",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nun*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"nun/chat/languages.py" = ["E501"]  # translated message table

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]  # FastAPI's intended parameter style
