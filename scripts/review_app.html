<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Nūn panel review</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#1F5E57;--gold:#C9A04A;--ink:#13201F;--sage:#F1F5F3;--line:#DCE5E1;--ok:#1F6B4E;--warn:#A64B28}
*{box-sizing:border-box} body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:var(--sage)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--teal);color:#fff}
header b{font-size:18px} header .sp{flex:1} header input{width:70px;padding:5px;border:0;border-radius:6px}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
#img{width:100%;max-height:82vh;object-fit:contain;background:#222;border-radius:8px}
.meta{font-size:12px;color:#556;margin-top:6px;word-break:break-word}
button{cursor:pointer;font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 12px;min-height:40px}
button.pri{background:var(--teal);color:#fff;border-color:var(--teal)} button.warn{color:var(--warn);border-color:var(--warn)}
header button{background:#fff2;color:#fff;border-color:#fff6}
.sugg{display:block;width:100%;text-align:right;margin:6px 0}
.sugg .ref{display:block;text-align:left;font-size:12px;color:#556}
.q{font-family:"Amiri Quran",serif;font-size:21px;line-height:2;direction:rtl}
.reading{direction:rtl;white-space:pre-wrap;background:var(--sage);border-radius:8px;padding:8px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
h3{margin:14px 0 4px;font-size:15px} input.txt{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.state{padding:8px;border-radius:8px;background:#e5f2ec;color:var(--ok);margin-top:8px} .err{background:#fbe9e3;color:var(--warn)}
#results{max-height:40vh;overflow:auto}
</style></head><body>
<header><b>نون · panel review</b><button id="prev">← Prev</button><span>#<input id="jump" type="number" min="1"></span>
<button id="next">Next →</button><button id="todo">Next unreviewed</button><span class="sp"></span><span id="count"></span></header>
<main><section class="card"><img id="img" alt="Panel"><div class="meta" id="meta"></div></section>
<section class="card"><h3>v1 reading (machine, may be wrong)</h3><div class="reading" id="reading"></div>
<h3>Suggestions: click the verse that is written on the panel</h3><div id="sugg"></div>
<h3>None is right? Search the Quran (words or 2:255)</h3>
<div class="row"><input class="txt" id="q" dir="rtl" style="flex:1" placeholder="وقل رب زدني علما · 20:114"><button id="go">Search</button></div>
<div id="results"></div>
<h3>Not a verse</h3><div class="row"><button data-t="name_of_allah">Name of Allah</button><button data-t="dhikr">Dhikr</button>
<button class="warn" data-t="other">Not Quran / other</button></div>
<h3>Same physical panel as another photo</h3><div class="row"><span>Same panel as #</span><input class="txt" id="same" type="number" min="1" style="width:90px">
<span>(applies with your next choice)</span></div>
<h3>Notes</h3><input class="txt" id="notes" style="width:100%" dir="auto">
<div id="state"></div></section></main>
<script>
const $=s=>document.querySelector(s); let n=1,total=0,cur=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(p,b){const r=await fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.detail||r.statusText);return j}
function verseBtn(ref,text){return `<button class="sugg" data-ref="${esc(ref)}"><span class="ref">${esc(ref)}</span><span class="q">${esc(text)}</span></button>`}
function bindVerses(root){root.querySelectorAll("button.sugg").forEach(b=>b.onclick=()=>choose("quran",b.dataset.ref))}
async function counts(){const p=(await api("/api/panels")).panels;total=p.length;$("#count").textContent=`${p.filter(x=>x.status==="done").length}/${total} reviewed`;return p}
async function show(k){cur=await api(`/api/panel/${k}`);n=k;total=cur.total;const r=cur.row;
 $("#jump").value=n;$("#img").src="/img/"+encodeURIComponent(r.file);
 $("#meta").innerHTML=`#${n} · ${esc(r.license)} · ${esc(r.author)} · <a href="${esc(r.url)}" target="_blank" rel="noopener">source</a> · ${esc(r.file)}`;
 $("#reading").textContent=r.reading||"(no reading)";
 $("#sugg").innerHTML=cur.suggestions.map(s=>verseBtn(s.ref,s.text)).join("")||"<p>No suggestion: search below or mark it.</p>";bindVerses($("#sugg"));
 $("#results").innerHTML="";$("#q").value="";$("#same").value="";$("#notes").value=r.notes||"";
 $("#state").innerHTML=r.type?`<div class="state">Saved: <b>${esc(r.type)}</b> ${esc(r.confirmed_ref)} · panel group ${esc(r.panel_group)}</div>`:"";counts()}
async function choose(type,ref=""){try{const same=parseInt($("#same").value)||null;
 await api(`/api/panel/${n}`,{type,confirmed_ref:ref,notes:$("#notes").value,same_as:same});
 const p=await counts();const nx=p.find(x=>x.n>n&&x.status==="todo")||p.find(x=>x.status==="todo");show(nx?nx.n:n)}
 catch(e){$("#state").innerHTML=`<div class="state err">${esc(e.message)}</div>`}}
document.querySelectorAll("button[data-t]").forEach(b=>b.onclick=()=>choose(b.dataset.t));
$("#go").onclick=async()=>{const r=await api("/api/search?q="+encodeURIComponent($("#q").value));
 $("#results").innerHTML=r.results.map(x=>verseBtn(x.ref,x.text)).join("")||"<p>No match.</p>";bindVerses($("#results"))};
$("#q").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
$("#prev").onclick=()=>show(Math.max(1,n-1));$("#next").onclick=()=>show(Math.min(total,n+1));
$("#jump").onchange=()=>show(Math.min(Math.max(1,parseInt($("#jump").value)||1),total));
$("#todo").onclick=async()=>{const p=await counts();const nx=p.find(x=>x.n>n&&x.status==="todo")||p.find(x=>x.status==="todo");if(nx)show(nx.n)};
counts().then(p=>{const f=p.find(x=>x.status==="todo");show(f?f.n:1)});
</script></body></html>
