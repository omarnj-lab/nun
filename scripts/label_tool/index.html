<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nūn labelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --teal:#1F5E57; --gold:#C9A04A; --ink:#13201F; --sage:#F1F5F3; --line:#DCE5E1; --ok:#1F6B4E; --warn:#A64B28; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; color:var(--ink); background:var(--sage); }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; background:var(--teal); color:#fff; flex-wrap:wrap; }
  header b { font-size:18px; } header .sp { flex:1; }
  header input { padding:6px 8px; border-radius:6px; border:0; width:140px; }
  header button { background:#fff2; color:#fff; border:1px solid #fff6; }
  header button.on { background:var(--gold); border-color:var(--gold); color:var(--ink); }
  main { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; }
  #img { width:100%; max-height:78vh; object-fit:contain; background:#222; border-radius:8px; }
  .meta { font-size:12px; color:#556; margin-top:6px; word-break:break-word; }
  label.h { display:block; font-weight:600; margin:12px 0 4px; }
  textarea { width:100%; font-size:20px; padding:8px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  button { cursor:pointer; padding:7px 12px; border-radius:7px; border:1px solid var(--line); background:#fff; font:inherit; min-height:36px; }
  button.primary { background:var(--teal); color:#fff; border-color:var(--teal); }
  button.warn { color:var(--warn); border-color:var(--warn); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .cand { border:1px solid var(--line); border-radius:8px; padding:8px; margin:6px 0; display:flex; gap:8px; align-items:flex-start; }
  .cand .q { font-family:"Amiri Quran",serif; font-size:20px; line-height:2; direction:rtl; }
  .cand small { color:#667; }
  .chips label { border:1px solid var(--line); border-radius:16px; padding:4px 10px; display:inline-flex; gap:4px; align-items:center; }
  .msg { padding:8px; border-radius:8px; margin-top:8px; }
  .msg.err { background:#fbe9e3; color:var(--warn); } .msg.ok { background:#e5f2ec; color:var(--ok); }
  .prev { background:#fff7e6; border:1px solid var(--gold); border-radius:8px; padding:8px; font-size:14px; }
  pre { white-space:pre-wrap; font-size:13px; direction:rtl; text-align:right; }
</style>
</head>
<body>
<header>
  <b>نون · labelling</b>
  <button id="mLabel" class="on">Label</button><button id="mReview">Review</button>
  <span class="sp"></span>
  <span>Your name <input id="who" placeholder="e.g. Saeed"></span>
  <span id="stats"></span>
</header>
<main>
  <section class="card">
    <img id="img" alt="Photo to label">
    <div class="meta" id="meta"></div>
  </section>
  <section class="card" id="panel"></section>
</main>
<script>
const $ = s => document.querySelector(s);
let mode = "label", cur = null, meta = null, skipped = [];
const who = () => $("#who").value.trim();
$("#who").value = localStorage.getItem("nun-who") || "";
$("#who").onchange = () => { localStorage.setItem("nun-who", who()); load(); };
$("#mLabel").onclick = () => setMode("label"); $("#mReview").onclick = () => setMode("review");
function setMode(m){ mode=m; skipped=[]; $("#mLabel").classList.toggle("on",m==="label"); $("#mReview").classList.toggle("on",m==="review"); load(); }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if(!r.ok) throw new Error(j.detail ? JSON.stringify(j.detail) : r.statusText); return j;
}
async function refreshStats(){ const s = await api("/api/stats"); $("#stats").textContent = `${s.labelled}/${s.candidates} labelled · ${s.reviewed} reviewed · ${JSON.stringify(s.by_type)}`; }

async function load(){
  meta = meta || await api("/api/meta");
  refreshStats();
  cur = await api(`/api/item?mode=${mode}&who=${encodeURIComponent(who())}&skip=${skipped.join(",")}`);
  if(!cur.id){ $("#img").removeAttribute("src"); $("#meta").textContent=""; $("#panel").innerHTML = `<p>Nothing left to ${mode}. 🎉</p>`; return; }
  const c = cur.candidate;
  $("#img").src = "/img/" + c.file;
  $("#meta").innerHTML = `${esc(c.title)} · ${esc(c.license)} · ${esc(c.author || c.credit || "")} · <a href="${esc(c.source_url)}" target="_blank" rel="noopener">source</a> · ${c.width}×${c.height} · ${esc(c.category)}`;
  mode === "label" ? labelForm() : reviewForm();
}

function checks(name, values, selected, type="checkbox"){
  return `<div class="row chips">${values.map(v => `<label><input type="${type}" name="${name}" value="${esc(v)}" ${selected.includes(v)?"checked":""}>${esc(v)}</label>`).join("")}</div>`;
}

function labelForm(){
  const p = cur.previous;
  $("#panel").innerHTML = `
    ${cur.review ? `<div class="prev"><b>Rejected by ${esc(cur.review.reviewer)}:</b> ${esc(cur.review.notes)}<br>Previous: ${esc(p.gt_type)} ${esc(JSON.stringify(p.refs||p.list_ids))}</div>` : ""}
    <label class="h">What is written? (type what you can read)</label>
    <textarea id="reading" rows="2" dir="rtl" placeholder="وقل رب زدني علما">${esc(p?.gt_text||"")}</textarea>
    <div class="row"><button class="primary" id="find">Find in corpus (Enter)</button><span id="found"></span></div>
    <div id="cands"></div>
    <label class="h">Style (one or more)</label>${checks("style", meta.styles, p?.style||[])}
    <label class="h">Theme</label>${checks("theme", meta.themes, p?.theme?[p.theme]:[], "radio")}
    <label class="h">Notes</label><textarea id="notes" rows="1" dir="auto"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="save">Save selected</button>
      <button id="other" title="Not Quran / Name / dhikr (poetry, names of people, etc.)">Other (not in corpus)</button>
      <button class="warn" id="skip" title="Unusable: unreadable, not calligraphy, duplicate, a person is identifiable">Skip image</button>
      <button id="later">Later</button>
    </div>
    <div id="msg"></div>`;
  $("#find").onclick = find;
  $("#reading").onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); find(); } };
  $("#save").onclick = () => save(null); $("#other").onclick = () => save("other"); $("#skip").onclick = () => save("skip");
  $("#later").onclick = () => { skipped.push(cur.id); load(); };
  $("#reading").focus();
}

async function find(){
  const r = await api("/api/locate", {text: $("#reading").value});
  $("#found").textContent = `${r.quran_total} Quran match(es)` + (r.quran_total>r.quran.length ? ` (showing ${r.quran.length})` : "");
  $("#cands").innerHTML =
    r.quran.map(q => `<div class="cand"><input type="checkbox" name="qref" value='${JSON.stringify({sura:q.sura,aya_from:q.aya_from,aya_to:q.aya_to})}' data-frag="${esc(q.fragment)}">
      <div><small>${esc(q.sura_name)} ${esc(q.ref)} · ${q.match}${q.match==="fuzzy"?" "+q.score:""} · inscribed part: ${esc(q.fragment)}</small><div class="q">${esc(q.uthmani)}</div></div></div>`).join("") +
    r.names.map(n => `<div class="cand"><input type="checkbox" name="lid" data-kind="name" value="${esc(n.id)}" data-frag="${esc(n.text)}"><div>Name of Allah: <b>${esc(n.text)}</b> <small>${esc(n.id)}</small></div></div>`).join("") +
    r.dhikr.map(d => `<div class="cand"><input type="checkbox" name="lid" data-kind="dhikr" value="${esc(d.id)}" data-frag="${esc(d.text)}"><div>Dhikr: <b>${esc(d.text)}</b> <small>${esc(d.id)}</small></div></div>`).join("") ||
    `<p class="msg err">No match. If it is not Quran / a Name / a listed dhikr, use “Other”.</p>`;
}

async function save(kind){
  const style = [...document.querySelectorAll('input[name=style]:checked')].map(i=>i.value);
  const theme = document.querySelector('input[name=theme]:checked')?.value || null;
  const q = [...document.querySelectorAll('input[name=qref]:checked')];
  const l = [...document.querySelectorAll('input[name=lid]:checked')];
  let gt_type = kind;
  if(!kind){ gt_type = q.length ? "quran" : (l[0]?.dataset.kind || null); }
  if(!gt_type){ return msg("Tick a match first, or use Other / Skip.", true); }
  if(!who()){ return msg("Enter your name (top right) first.", true); }
  if(gt_type==="quran" && l.length){ return msg("Pick either Quran references or list entries, not both.", true); }
  const body = { id: cur.id, labeller: who(), gt_type, style, theme, notes: $("#notes").value,
    refs: q.map(i => JSON.parse(i.value)), list_ids: l.map(i => i.value),
    gt_text: gt_type==="skip" ? "" : ([...q, ...l].map(i=>i.dataset.frag).join(" | ") || $("#reading").value.trim()) };
  try { await api("/api/label", body); load(); } catch(e){ msg(e.message, true); }
}

function reviewForm(){
  const L = cur.label;
  $("#panel").innerHTML = `
    <p><b>${esc(L.gt_type)}</b> by ${esc(L.labeller)}</p>
    <label class="h">Refs / entries</label><pre>${esc(JSON.stringify(L.gt_type==="quran"?L.refs:L.list_ids))}</pre>
    <label class="h">Text</label><pre>${esc(L.gt_text)}</pre>
    <div id="rq"></div>
    <label class="h">Style / theme</label><div>${esc(L.style.join(", "))} · ${esc(L.theme)}</div>
    <label class="h">Labeller notes</label><div>${esc(L.notes)}</div>
    <label class="h">Your note (required when rejecting)</label><textarea id="rnotes" rows="2" dir="auto"></textarea>
    <div class="row" style="margin-top:12px"><button class="primary" id="ok">Confirm</button><button class="warn" id="no">Reject</button><button id="later">Later</button></div>
    <div id="msg"></div>`;
  if(L.gt_type==="quran"){ api("/api/locate",{text:L.gt_text.split(" | ")[0]}).then(r => {
    const want = new Set(L.refs.map(x=>`${x.sura}:${x.aya_from}`+(x.aya_to!==x.aya_from?`-${x.aya_to}`:"")));
    $("#rq").innerHTML = r.quran.filter(q=>want.has(q.ref)).map(q=>`<div class="cand"><div><small>${esc(q.sura_name)} ${esc(q.ref)}</small><div class="q">${esc(q.uthmani)}</div></div></div>`).join("");
  }); }
  $("#ok").onclick = () => rev("confirm"); $("#no").onclick = () => rev("reject");
  $("#later").onclick = () => { skipped.push(cur.id); load(); };
}
async function rev(verdict){
  if(!who()) return msg("Enter your name (top right) first.", true);
  if(verdict==="reject" && !$("#rnotes").value.trim()) return msg("Say what is wrong.", true);
  try { await api("/api/review", {id:cur.id, reviewer:who(), verdict, notes:$("#rnotes").value}); load(); } catch(e){ msg(e.message, true); }
}
function msg(t, err){ $("#msg").innerHTML = `<div class="msg ${err?"err":"ok"}">${esc(t)}</div>`; }
load();
</script>
</body>
</html>
